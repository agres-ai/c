<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出勤簿の確認 / Attendance confirmation</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 24px; display: flex; justify-content: center; }
  .card { background: #fff; border-radius: 12px; padding: 32px 24px; max-width: 420px; width: 100%;
          box-shadow: 0 1px 4px rgba(0,0,0,.1); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .sub { color: #555; font-size: 14px; margin: 4px 0; }
  .en { color: #777; font-size: 13px; }
  button { margin-top: 20px; padding: 14px 28px; font-size: 16px; border: none; border-radius: 8px;
           background: #1a73e8; color: #fff; cursor: pointer; }
  button:active { background: #1558b0; }
  button[disabled] { background: #9bb8e4; cursor: default; }
</style>
</head>
<body>
<div class="card" id="card">
  <p class="sub">読み込んでいます…<br><span class="en">Loading…</span></p>
</div>

<script>
/*
 * 出勤簿の本人確認ページ。
 *
 * 画面はここで描き、出勤簿マスターへの書き込みだけを Google Apps Script に投げる。
 * GASのURLへ「遷移」させないことが肝心で、スマホのブラウザは script.google.com へ遷移すると
 * ログイン中のアカウント番号を /macros/u/<番号>/s/... の形で差し込み、404になる
 * （2026-09-08、実機Androidで確認。URLを手で貼ったときだけ通り、転送を挟んでも遷移なら同じだった）。
 * <script>タグでの読み込み（JSONP）は遷移ではないため、この書き換えが起きない。
 */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzN4mvHyrOhSDRiixm9sp1dKspIAd2pb3H4legvRTRJEfeRpCwDVqkok11gxCUcfHrNfA/exec';

var params = new URLSearchParams(window.location.search);
var empNum = params.get('e') || '';
var month  = params.get('m') || '';
var card   = document.getElementById('card');
var seq    = 0;
var knownName = '';   // 氏名は後から届くので、届いた分をここに持っておく

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/*
 * GASを呼ぶ。本命は credentials:'omit' のfetch。
 * クッキーを一切送らないので、Googleがログイン中のアカウント単位のURLへ振り替える余地がない。
 * （JSONPだとクッキーが乗ってしまい、複数アカウントの端末で失敗した。2026-09-08）
 * fetchが使えない古い端末のために、JSONPも予備として残す。
 */
function callGas(extra, onDone) {
  var qs = new URLSearchParams({ e: empNum, m: month });
  for (var k in extra) qs.set(k, extra[k]);

  if (window.fetch) {
    var url = GAS_URL + '?' + qs.toString() + '&api=1';
    fetch(url, { credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (res) { onDone(res); })
      .catch(function (err) { callGasJsonp(qs, onDone, 'fetch: ' + err); });
  } else {
    callGasJsonp(qs, onDone, null);
  }
}

function callGasJsonp(qs, onDone, prevError) {
  var name = '__cb' + (++seq);
  var tag;
  var timer = setTimeout(function () {
    cleanup();
    onDone({ ok: false, error: 'タイムアウト' + (prevError ? '（' + prevError + '）' : '') });
  }, 25000);

  function cleanup() {
    clearTimeout(timer);
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (tag && tag.parentNode) tag.parentNode.removeChild(tag);
  }

  window[name] = function (res) { cleanup(); onDone(res); };

  qs.set('callback', name);
  tag = document.createElement('script');
  tag.src = GAS_URL + '?' + qs.toString();
  tag.crossOrigin = 'anonymous';   // クッキーを送らせない
  tag.onerror = function () {
    cleanup();
    onDone({ ok: false, error: '通信に失敗しました' + (prevError ? '（' + prevError + '）' : '') });
  };
  document.head.appendChild(tag);
}

function showError(msg) {
  card.innerHTML =
    '<h1>エラーが発生しました</h1>' +
    '<p class="en">Something went wrong. Please try again.</p>' +
    '<p class="sub">' + esc(msg) + '</p>' +
    '<button type="button" id="retry">もう一度 / Retry</button>';
  document.getElementById('retry').onclick = function () { window.location.reload(); };
}

function showDone(name) {
  card.innerHTML =
    '<h1>確認ありがとうございました</h1>' +
    '<p class="en">Thank you for confirming.</p>' +
    '<p class="sub">' + esc(empNum) + ' ' + esc(name) + ' 様 ／ ' + esc(month) + '分</p>';
}

function showConfirm(name) {
  card.innerHTML =
    '<h1>' + esc(empNum) + (name ? ' ' + esc(name) : '') + ' 様</h1>' +
    '<p class="sub">' + esc(month) + '分の出勤簿</p>' +
    '<p>内容を確認の上、下のボタンを押してください。</p>' +
    '<p class="en">Please check your attendance record, then tap the button below.</p>' +
    '<button type="button" id="go">確認しました / Confirm</button>';

  document.getElementById('go').onclick = function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = '送信中… / Sending…';
    callGas({ c: '1' }, function (res) {
      if (res && res.ok) showDone(knownName || name);
      else {
        btn.disabled = false;
        btn.textContent = '確認しました / Confirm';
        showError((res && res.error) || '不明なエラー');
      }
    });
  };
}

/*
 * 氏名の取得を待たずに、すぐボタンまで出す。
 * 社員番号と対象月はQRから分かっているので、氏名だけ後から差し込めば待たせる必要がない。
 * （待ってから描いていたため「挙動が遅い」と指摘を受けた。2026-09-08）
 */
if (!empNum || !month) {
  showError('QRコードの読み取りが不完全です（社員番号または対象月がありません）');
} else {
  showConfirm('');
  callGas({}, function (res) {
    if (res && res.ok && res.name) {
      var h = document.querySelector('#card h1');
      if (h) h.textContent = empNum + ' ' + res.name + ' 様';
      knownName = res.name;
    }
  });
}
</script>
</body>
</html>
